<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <!-- Original Shopaa Express Geometric Parcel-A Emblem -->
  <g transform="translate(8, 12)">
    <rect x="2" y="2" width="52" height="52" rx="14" fill="#EE4D2D"/>
    <!-- Geometric A + Express Wing -->
    <path d="M 15,41 L 28,13 L 41,41" fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 20.5,31 L 35.5,31" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="41" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Brand Wordmark: Shopaa -->
  <text x="72" y="51" font-family="'Roboto', 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="800" fill="#EE4D2D" letter-spacing="-0.5">Shopaa</text>

  <!-- Tagline: EXPRESS -->
  <text x="196" y="51" font-family="'Roboto', 'Arial Black', Arial, sans-serif" font-size="30" font-weight="900" font-style="italic" fill="#EE4D2D" letter-spacing="0.4">EXPRESS</text>
</svg>
