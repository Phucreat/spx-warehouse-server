services:
  spx-server:
    container_name: spx_phu_chan_server
    build:
      context: .
      dockerfile: Dockerfile
    image: spx-phuchan-server:latest
    ports:
      - "${SERVER_PORT:-8090}:8090"
    volumes:
      # Lưu trữ CSDL bền vững ra ngoài máy chủ (không mất dữ liệu khi tắt container)
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8090
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.oodsyjcogjzqutqavrpz:Phudeptrai1%40@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres}
      - SECRET_KEY=spx-mega-soc-phu-chan-secret-2026
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

