{% extends "base.html" %}

{% block title %}Đăng Ký Tài Khoản - Shopee Việt Nam{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4">
  <div class="w-full max-w-md">
    
    <!-- Register Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
      
      <!-- Card Header -->
      <div class="bg-gradient-to-r from-shopee to-orange-600 p-6 text-white text-center">
        <div class="w-14 h-14 bg-white/20 backdrop-blur rounded-2xl flex items-center justify-center mx-auto mb-2 text-2xl shadow-inner">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2 class="text-xl font-black">Đăng Ký Tài Khoản Shopee</h2>
        <p class="text-xs text-orange-100 mt-1">Dành cho Khách Hàng / Người Mua Sắm</p>
      </div>

      <!-- Register Form -->
      <div class="p-6">
        <div id="registerAlert" class="hidden mb-4 p-3 rounded-lg text-xs font-semibold"></div>

        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3.5">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Họ và tên của bạn *</label>
            <input type="text" id="regFullName" required placeholder="VD: Nguyễn Văn A"
                   class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-xs focus:ring-1 focus:ring-shopee focus:border-shopee">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Số điện thoại *</label>
            <input type="text" id="regPhone" required placeholder="VD: 0987654321"
                   class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-xs focus:ring-1 focus:ring-shopee focus:border-shopee">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Tên đăng nhập mong muốn *</label>
            <input type="text" id="regUsername" required placeholder="VD: nguyen_van_a"
                   class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-xs focus:ring-1 focus:ring-shopee focus:border-shopee">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Mật khẩu *</label>
            <input type="password" id="regPassword" required placeholder="Tối thiểu 3 ký tự"
                   class="w-full px-3 py-2.5 border border-gray-300 rounded-xl text-xs focus:ring-1 focus:ring-shopee focus:border-shopee">
          </div>

          <button type="submit" id="btnRegister"
                  class="w-full btn-shopee py-3 rounded-xl font-bold text-sm shadow-md flex items-center justify-center mt-2">
            <i class="fa-solid fa-check mr-2"></i> ĐĂNG KÝ NGAY
          </button>
        </form>

        <!-- Login Link -->
        <div class="mt-5 text-center text-xs text-gray-500 pb-2">
          Đã có tài khoản? 
          <a href="/login" class="text-shopee font-bold hover:underline">Đăng nhập tại đây</a>
        </div>
      </div>

    </div>

  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('btnRegister');
    const alertBox = document.getElementById('registerAlert');

    const fullName = document.getElementById('regFullName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Đang tạo tài khoản...';
    alertBox.classList.add('hidden');

    try {
      const res = await fetch('/api/v1/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          full_name: fullName,
          phone: phone,
          username: username,
          password: password
        })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Không thể tạo tài khoản');
      }

      alertBox.className = 'mb-4 p-3 rounded-lg text-xs font-semibold bg-green-50 text-green-700 border border-green-200 block';
      alertBox.innerHTML = '<i class="fa-solid fa-circle-check mr-1.5"></i> Đăng ký thành công! Đang tự động đăng nhập...';

      setTimeout(() => {
        window.location.href = '/';
      }, 500);
    } catch(err) {
      alertBox.className = 'mb-4 p-3 rounded-lg text-xs font-semibold bg-red-50 text-red-700 border border-red-200 block';
      alertBox.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1.5"></i> ${err.message}`;
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> ĐĂNG KÝ NGAY';
    }
  }
</script>
{% endblock %}
